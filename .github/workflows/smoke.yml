name: smoke

# main 에 올라오거나 PR 이 열릴 때마다: 문법 검사 + 실제 브라우저로 모든 디자인을 여러 업종·시점에서 그려 오류 확인
on:
  push:
    branches: [main]
    paths: ['public/**', 'tests/**', 'scripts/build-app.mjs', 'scripts/build-studio-tokens.mjs', 'scripts/refresh-trends.mjs', 'scripts/trend-youtube.mjs', 'scripts/alerts/**', 'api/**', 'lib/**', 'package*.json', '.github/workflows/smoke.yml']
  pull_request:
    paths: ['public/**', 'tests/**', 'scripts/build-app.mjs', 'scripts/build-studio-tokens.mjs', 'scripts/refresh-trends.mjs', 'scripts/trend-youtube.mjs', 'scripts/alerts/**', 'api/**', 'lib/**', 'package*.json', '.github/workflows/smoke.yml']
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build + syntax check (app scripts)
        run: |
          node scripts/build-app.mjs
          for f in public/assets/app/*.js; do node --check "$f" || exit 1; done
          echo "syntax ok"
      - name: Load every API module (catches missing files / require errors)
        run: |
          npm ci --omit=dev --no-audit --no-fund || npm install --omit=dev --no-audit --no-fund
          for f in api/*.js; do node -e "require('./$f')" || { echo "FAILED: $f"; exit 1; }; done
          echo "api modules ok"
      - name: Install Playwright
        run: |
          npm i --no-save playwright@1.48.2 @electric-sql/pglite@0.3.14
          npx playwright install --with-deps chromium
      - name: Verify Astryx design tokens
        run: npm run design:tokens -- --check
      - name: Narration follows voice timing
        run: |
          node tests/narration-continuity.mjs
          node tests/narration-browser.mjs
      - name: Production cost and export safety
        run: |
          node tests/account-projects.cjs
          node tests/projects-browser.mjs
          node tests/kakao-browser.mjs
          node tests/production-safety.cjs
          node tests/export-safety.mjs
      - name: Kinetic typography editing and seeking
        run: node tests/motion-typography.mjs
      - name: Topic images and cut replacement
        run: |
          node tests/script-timeout.cjs
          node tests/z-image.cjs
          node tests/local-images-browser.mjs
      - name: Free trend fallback
        run: node tests/trend-youtube.mjs
      - name: Reference style ingestion
        run: |
          python3 scripts/alerts/test_style_commands.py
          node --test tests/reference-styles.cjs
          node tests/reference-styles-browser.mjs
      - name: Render every design
        run: node tests/smoke-render.mjs
      - name: Voice audition and selection
        run: node tests/voice-preview.mjs
