<header><b>오토릴스<span>메이커</span></b><a data-studio-back href="/studio?from=shorts">스튜디오로 돌아가기</a><p class="me-title" aria-hidden="true">영상 편집기</p><div style="display:flex;align-items:center;gap:6px;margin-left:auto;"><button id="headerStudioEdit" type="button" onclick="document.getElementById('applyTheme')?.click()" style="border:1px solid #3b82f6;background:#132038;color:#bfdbfe;border-radius:7px;padding:5px 9px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;" title="다듬은 영상을 스튜디오 편집 모드로 바로 넘기기">스튜디오 꾸미기</button><button id="mixPublish" type="button" hidden>저장·발행</button></div></header>
<section class="stage" hidden><div id="frame"><video playsinline id="sourceVideo" hidden></video><canvas id="overlay" width="540" height="960" aria-label="영상 제목과 자막"></canvas><button type="button" id="emptyVideoPick" hidden>＋ 영상 추가</button><button id="play" hidden type="button" aria-label="선택 구간 재생">▶</button></div><div id="shortsEditHud" hidden><div id="seTopBar"><div class="se-header-row"><span class="se-badge">편집 모드</span><div class="se-header-actions"><button type="button" id="seUndoBtn" disabled title="되돌리기" aria-label="되돌리기">↩</button><button type="button" id="seDoneBtn" title="편집 완료">완료</button></div></div><div class="se-tool-row" role="group" aria-label="편집 도구"><button type="button" data-se="detail" title="세부 편집 · 스튜디오 꾸미기" aria-label="세부 편집"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/></svg></button><button type="button" data-se="caption" title="글씨 · 자막 넣기">Aa</button><button type="button" data-se="draw" title="그리기 (펜 · 형광펜 · 네온)" aria-label="그리기"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button><button type="button" data-se="sticker" title="스티커 · 프레임 · 내 사진" aria-label="스티커"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8Z"/><path d="M15 3v4a2 2 0 0 0 2 2h4"/><path d="M8 13h.01"/><path d="M16 13h.01"/><path d="M9.5 16.5a3.5 3.5 0 0 0 5 0"/></svg></button><button type="button" data-se="cutout" title="AI 누끼 · 컷아웃" aria-label="AI 누끼"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="4.5"/><circle cx="8.5" cy="14.5" r="4.5"/><circle cx="15.5" cy="14.5" r="4.5"/></svg></button><button type="button" data-se="effect" title="꾸밈효과 · 색감" aria-label="꾸밈효과"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg></button></div></div><div id="seDrawOverlay" hidden><div class="se-draw-top"><div class="se-draw-left"><button type="button" id="seDrawBrushBtn">펜</button><button type="button" id="seDrawSizeBtn">보통</button><button type="button" id="seDrawUndoBtn" title="한 획 취소">↩</button><button type="button" id="seDrawClearBtn">지움</button></div><button type="button" id="seDrawDoneBtn">완료</button></div><div id="seDrawPad"></div><div id="seDrawColorBar"></div></div><div id="seSelectedBar" hidden><div class="se-sel-row"><span id="seSelLabel">크기</span><input type="range" id="seScaleSlider" min="0.45" max="2.5" step="0.05" value="1"><span id="seScaleVal">100%</span></div><div class="se-sel-actions"><div class="se-rot-group" id="seRotGroup"><button type="button" id="seRotL" title="왼쪽 회전">↺</button><button type="button" id="seRotR" title="오른쪽 회전">↻</button><button type="button" id="seRot0" title="0도">0°</button></div><div class="se-act-group"><button type="button" id="seDupBtn">복제</button><button type="button" id="seEditBtn">수정</button><button type="button" id="seDelBtn" title="삭제">✕</button></div></div></div></div></section>
<section class="sheet"><div class="handle"></div><div id="entry">
<h1>내 영상으로 쇼츠 만들기</h1><p class="hint">한국어로 말하는 영상에서 쇼츠로 쓸 구간을 찾아요.</p>
<label class="field" for="initialGuide">어떤 장면을 찾을까요? <small>선택</small></label>
<input id="initialGuide" class="edit-input" maxlength="120" placeholder="예: 타격 자세를 바꾼 이유">
<label class="entry" for="file"><span><strong>갤러리에서 영상 선택</strong><small>최대 10분 · 250MB</small></span><i>›</i></label><input id="file" type="file" accept="video/*" class="sr">
<p class="hint">처음 사용할 때 다운로드가 진행돼요.</p></div>
<div id="work" hidden><div class="heading"><button id="back" type="button" aria-label="다른 영상 선택">‹</button><h1>내 영상으로 쇼츠 만들기</h1></div>
<p id="status" role="status"></p><progress id="progress" max="1" value="0" aria-label="음성 분석 진행률"></progress>
<section id="cutTimeline" hidden aria-label="컷 편집">
<div class="track-heading"><h2>타임라인</h2><button id="dockFile" type="button" aria-label="타임라인에 영상 추가">＋ 클립</button><output id="trackTime" for="trackCursor">0:00.0 / 0:00.0</output></div>
<div id="analysisInfo" hidden><span id="analysisText"></span><button id="applyReadyPlan" type="button" hidden>적용</button></div>
<div class="mix-viewport"><div class="track-names"><div class="ruler-spacer"><button id="addTrackBtn" type="button" aria-label="새 트랙 추가">＋ 트랙</button></div><button type="button" class="mix-label" data-track="video"><i aria-hidden="true">▣</i>영상</button><button type="button" class="mix-label" data-track="effect"><i aria-hidden="true">✧</i>효과</button><button type="button" class="mix-label" data-track="sticker" hidden><i aria-hidden="true">★</i>스티커</button><button type="button" class="mix-label" data-track="sfx"><i aria-hidden="true">⌁</i>효과음</button><button type="button" class="mix-label" data-track="source"><i aria-hidden="true">♩</i>원본 소리</button><button type="button" class="mix-label" data-track="music"><i aria-hidden="true">♫</i>음악</button><button type="button" class="mix-label" data-track="caption"><i aria-hidden="true">T</i>자막</button></div><div class="mix-scroll"><div class="track-board"><div class="track-ruler"><div id="trackScale" aria-hidden="true"></div><input type="range" id="trackCursor" aria-label="편집본 재생 위치" min="0" max="0" step="0.01" value="0" disabled></div>
<div class="mix-row"><div id="trackClips" aria-label="편집할 클립"></div><div id="cutMarkers"></div></div>
<div class="mix-row"><div id="fxLanes" aria-label="효과 타임라인"></div></div>
<div class="mix-row" id="stickerRow" hidden><div id="stickerLane" class="mix-content" aria-label="스티커 구간"></div></div>
<div class="mix-row"><div id="sfxLane" class="mix-content" aria-label="효과음 구간"></div></div>
<div class="mix-row"><button type="button" id="sourceLane" class="mix-content"><canvas id="trackWave" width="640" height="34" aria-label="원본 소리 파형" hidden></canvas><span id="sourceWaveState"></span></button></div>
<div class="mix-row"><button type="button" id="musicLane" class="mix-content"><canvas id="musicWave" width="640" height="34" hidden></canvas><span></span></button></div>
<div class="mix-row"><div id="captionLane" class="mix-content" aria-label="자막 구간"></div></div>
<div id="trackNeedle" aria-hidden="true"></div></div></div></div>
<section id="fxPanel" aria-label="영상 효과" hidden>
<div class="fx-heading"><h3>효과</h3></div>
<div id="fxPresetList" aria-label="바로 추가할 효과"></div>
<fieldset id="fxInspector" hidden><legend id="fxName"></legend>
<label>시작(초)<input id="fxStart" type="number" min="0" step="0.01"></label>
<label>길이(초)<input id="fxDuration" type="number" min="0.05" step="0.01"></label>
<label>강도<input id="fxStrength" type="range" min="0" max="100"></label>
<button type="button" id="fxCopy">복제</button><button type="button" id="fxRemove">효과 삭제</button></fieldset></section>
<div id="trackTools" aria-label="선택한 클립 편집">
<button type="button" id="trackSplit" disabled>분할</button><button type="button" id="trackDelete" disabled>삭제</button><button type="button" id="trackLeft" disabled aria-label="선택한 클립을 앞으로">← 앞으로</button><button type="button" id="trackRight" disabled aria-label="선택한 클립을 뒤로">뒤로 →</button><button type="button" id="trackUndo" disabled>되돌리기</button>
</div><div id="mixActions" aria-label="선택 트랙 도구"></div></section>
<section id="joinTools" hidden><label class="entry" for="joinFiles"><strong>영상 추가해서 이어붙이기</strong></label><input type="file" id="joinFiles" class="sr" accept="video/*" multiple><div id="joinList"></div><p id="joinNotice" class="hint" role="status"></p></section>
<details id="editSettings" open><summary>세부 편집</summary><fieldset id="quickControls" hidden><legend>영상 편집</legend>
<div id="cutMode" class="guide-row"><button id="useMontage" type="button" aria-pressed="true">자동 편집본</button><button id="useManual" type="button" aria-pressed="false">직접 편집</button></div>
<p class="hint" role="status" id="montageStatus"></p>
<progress id="montageProgress" max="100" hidden aria-label="장면 분석 진행률"></progress>
<label id="transitionControl" class="toggle" hidden><input id="sceneTransitions" type="checkbox"> 장면 전환</label>
<section id="highlightEditor" hidden aria-label="하이라이트 편집">
<label class="field" for="editCursor">원본 타임라인 <output id="cursorTime">0.0초</output></label>
<input type="range" id="editCursor" min="0" step="0.1" value="0">
<p id="peakTime" class="hint"></p>
<div class="guide-row"><button type="button" id="setPeak">여기를 하이라이트로</button><button type="button" id="previewPeak">강조 구간 재생</button></div>
<label class="toggle"><input id="peakEffect" type="checkbox" checked> 하이라이트 강조</label>
<div id="trimmedGaps"></div></section>
<div id="manualTrim"><label class="field" for="trimStart">시작 <output id="startTime"></output></label><input id="trimStart" type="range" min="0" step="any">
<label class="field" for="trimEnd">끝 <output id="endTime"></output></label><input id="trimEnd" type="range" min="0" step="any">
</div><label class="field" for="speed">재생 속도</label><select class="edit-input" id="speed"><option value="0.8">0.8배</option><option value="1" selected>1배</option><option value="1.25">1.25배</option><option value="1.5">1.5배</option></select>
<label class="toggle"><input id="sourceSound" type="checkbox" checked> 원본 소리</label>
<label class="field" for="music">배경 음악</label><select class="edit-input" id="music"><option value="">음악 없음</option></select>
<label class="field" for="captionStyle">자막 스타일</label><select class="edit-input" id="captionStyle"><option value="box">기본 · 어두운 배경</option><option value="outline">흰 글씨 · 테두리</option></select>
</fieldset>
<form id="guideForm"><label class="field" for="guide">찾고 싶은 내용</label><div class="guide-row"><input class="edit-input" id="guide" maxlength="120" placeholder="비우면 핵심 발언을 추천해요"><button type="submit">적용</button></div></form>
<p id="rankStatus" class="hint" role="status"></p><div id="clips" aria-label="추천 구간"></div>
<details id="editor" hidden><summary>제목·자막 편집</summary><fieldset id="fields"><label class="field" for="clipTitle">영상 위 제목</label>
<input class="edit-input" id="clipTitle" maxlength="52" placeholder="제목 입력"><label class="toggle"><input id="showCaptions" type="checkbox" checked> 대사 자막 표시</label><div id="lineFields"></div></fieldset></details></details>
<button id="openInEditor" class="primary" type="button" hidden>이 구간을 편집기에서 다듬기</button><button id="save" class="primary" type="button" disabled>선택한 구간 저장</button><a id="download" hidden download="오토릴스메이커-쇼츠.mp4">완성된 MP4 다운로드</a><button id="applyTheme" type="button" hidden>스튜디오 테마 입히기</button><section id="quickPublish" hidden aria-label="SNS 발행">
<label class="field" for="postTarget">발행 계정</label><select id="postTarget" class="edit-input"></select>
<label class="field" for="postCaption">게시글 본문</label><textarea id="postCaption" class="edit-input" rows="2" maxlength="2100"></textarea>
<button id="postVideo" class="primary" type="button" disabled>SNS에 발행</button>
<p id="postStatus" class="hint" role="status"></p></section></div>
</section></main><dialog id="mixDialog"><div class="mix-dialog-head"><button type="button" id="mixClose" aria-label="닫기">×</button><h2 id="mixTitle">효과</h2><button type="button" id="mixDone">완료</button></div><div id="mixOptions"></div><p id="mixError" role="status"></p></dialog><script src="return.js"></script><script src="export-access.js?v=cuts2"></script><script src="shorts.js?v=cap3"></script><script src="editor.js?v=cap10"></script><script src="quick.js?v=cuts2"></script><script src="join.js?v=mt1"></script><script src="sns-transport.js"></script><script src="publish.js"></script><script src="cutout.js?v=co2"></script><script src="stickers.js?v=st3"></script><script src="effects.js?v=fx4"></script><script src="cut-transitions.js?v=cuts2"></script><script src="timeline.js?v=tl2"></script><script src="multitrack.js?v=th12"></script><script src="shorts-handoff.js?v=th2"></script></body></html>
