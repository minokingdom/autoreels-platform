name: iPhone reference
on:
  push:
    paths: ['ios/**', '.github/workflows/ios-reference.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iphone:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Generate iOS project
        working-directory: ios
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen generate
      - name: Build for iPhone
        working-directory: ios
        run: |
          xcodebuild -project AutoReelsMaker.xcodeproj -scheme AutoReelsMaker -configuration Release -destination 'generic/platform=iOS' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Run simulator test
        working-directory: ios
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          xcodebuild -project AutoReelsMaker.xcodeproj -scheme AutoReelsMaker -destination "id=$DEVICE" -derivedDataPath DerivedData -parallel-testing-enabled NO -resultBundlePath TestResult test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iPhone-simulator
          path: |
            ios/DerivedData/Build/Products/Debug-iphonesimulator/AutoReelsMaker.app
            ios/TestResult.xcresult
