<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>오토릴스 운영 관리</title>
  <link rel="stylesheet" href="/assets/admin.css?v=1">
</head>
<body>
  <main>
    <header class="page-head">
      <h1>오토릴스 운영 관리</h1>
      <div class="actions">
        <a href="/studio">스튜디오</a>
        <button type="button" id="adminLogout" hidden>로그아웃</button>
      </div>
    </header>
    <form id="adminLogin" class="panel" hidden>
      <label for="adminKey">관리자 키</label>
      <input id="adminKey" type="password" maxlength="512" autocomplete="current-password" required>
      <button type="submit" class="primary">로그인</button>
    </form>
    <p id="adminMessage" role="status">관리자 인증을 확인하고 있습니다.</p>
    <section id="adminDashboard" aria-labelledby="specialtiesHeading" hidden>
      <dl class="summary">
        <div class="panel"><dt>전체 회원</dt><dd id="accountsCount">–</dd></div>
        <div class="panel"><dt>세부 업종을 입력한 회원</dt><dd id="configuredCount">–</dd></div>
        <div class="panel"><dt>등록된 세부 업종 유형</dt><dd id="specialtiesCount">–</dd></div>
      </dl>
      <section class="panel">
        <div class="section-head">
          <div>
            <h2 id="specialtiesHeading">세부 업종과 수집 현황</h2>
            <p>새벽 수집 대상과 최근 결과를 확인합니다.</p>
          </div>
          <div class="actions">
            <label for="industryFilter">대분류</label>
            <select id="industryFilter"><option value="">전체 업종</option></select>
            <button type="button" id="refreshAdmin">다시 불러오기</button>
          </div>
        </div>
        <div class="table-scroll" role="region" aria-label="세부 업종별 수집 현황" tabindex="0">
          <table>
            <thead><tr><th scope="col">대분류</th><th scope="col">세부 업종</th><th scope="col">회원 수</th><th scope="col">최근 수집 시도</th><th scope="col">수집 상태</th><th scope="col">추천에 사용하는 키워드</th></tr></thead>
            <tbody id="specialtyRows"></tbody>
          </table>
        </div>
        <div class="actions pagination">
          <button type="button" id="previousPage" disabled>이전</button>
          <span id="pageLabel">1페이지</span>
          <button type="button" id="nextPage" disabled>다음</button>
        </div>
      </section>
    </section>
  </main>
  <script defer src="/assets/landing/industries.js"></script>
  <script defer src="/assets/admin.js?v=1"></script>
</body>
</html>
