name: daily-keywords
on:
  schedule:
    # 04:13, 12:13 and 18:13 Korea time
    - cron: '13 19,3,9 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-keywords
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 scripts/refresh_daily_keywords.py
      - name: Publish verified daily keywords
        run: |
          git add public/daily-keywords.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name autoreels-bot
          git config user.email actions@users.noreply.github.com
          git commit -m "오늘의 이슈와 검색어 갱신"
          git pull --rebase origin main
          git push origin main
