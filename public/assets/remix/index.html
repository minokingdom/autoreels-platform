<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오토릴스메이커 · 참고 쇼츠·릴스로 재구성하기</title>
<link rel="stylesheet" href="../shorts/screen.css"><link rel="stylesheet" href="remix.css?v=link-progress">
</head><body><main>
<header><b>오토릴스<span>메이커</span></b><a data-studio-back href="/studio?from=shorts">스튜디오로 돌아가기</a></header>
<section class="stage" id="stage" hidden><div id="frame"><canvas id="preview" width="540" height="960" aria-label="재구성한 영상"></canvas><button id="play" type="button" aria-label="미리보기 재생">▶</button></div></section>
<section class="sheet"><div class="handle"></div><h1>참고 쇼츠·릴스로 재구성하기</h1>
<p class="hint">참고 쇼츠의 컷 길이에 맞춰 내 영상과 자막으로 새 쇼츠를 만들어요.</p>
<fieldset id="inputs">
<form id="urlForm">
<label class="field" for="referenceUrl">참고 영상 URL</label>
<div class="url-row"><input id="referenceUrl" type="text" inputmode="url" autocomplete="off" maxlength="5000" required class="edit-input" placeholder="참고 영상 링크 붙여넣기"><button id="urlSubmit" type="submit" disabled>링크 분석</button></div>
<div id="linkFeedback" hidden>
<p id="linkMessage" role="status"></p>
<div id="linkProgress" role="progressbar" aria-labelledby="linkMessage" hidden></div>
</div>
<p class="hint"><span id="sourceTypes">영상 파일·CapCut 링크 지원</span> · 최대 90초</p>
<a id="loginHelp" href="/studio?from=shorts" hidden>스튜디오에서 로그인</a>
</form>
<label class="entry" for="reference"><span><strong>갤러리에서 참고 영상 선택</strong><small id="refName">유튜브·인스타는 저장한 영상 선택 · 최대 250MB</small></span><i aria-hidden="true">›</i></label>
<input class="sr" type="file" id="reference" accept="video/*">
<div id="arrange" hidden>
<section id="referenceStory" hidden aria-labelledby="referenceStoryTitle">
<h2 id="referenceStoryTitle">원본에서 찾은 주제</h2><p id="sourceTopic"></p>
<details id="sourceDetails"><summary>장면별 원본 문구·대사 보기</summary><ol id="sourceLines"></ol></details>
<form id="adaptForm"><label class="field" for="adaptChange">어떤 부분을 바꿀까요?</label>
<input id="adaptChange" class="edit-input" maxlength="240" required placeholder="예: 청바지와 면바지 비교를 운동화와 구두 비교로">
<button id="adapt" type="submit" class="secondary">내 주제에 맞게 대본 바꾸기</button><p id="adaptStatus" role="status"></p></form>
</section>
<label class="entry" for="photos"><span><strong>내 영상·사진 선택</strong><small>한 영상은 컷마다 이어져요 · 최대 10개</small></span><i aria-hidden="true">›</i></label><input class="sr" type="file" id="photos" accept="video/*,image/*" multiple>
<h2>장면별 문구</h2><div id="scenes"></div></div></fieldset>
<p id="status" role="status" aria-live="polite"></p>
<div id="actions" hidden><button class="primary" id="save" type="button">MP4 만들기</button><a id="download" hidden download="오토릴스메이커-재구성.mp4">완성된 MP4 다운로드</a>
<button class="secondary" id="project" type="button">Hypit 편집 프로젝트 저장</button></div>
</section></main><script src="../shorts/return.js"></script><script src="../shorts/export-access.js"></script><script type="module" src="remix.mjs?v=native-import-1"></script></body></html>
