name: iPhone reference diagnostics
on: [push]
permissions:
  contents: read
  actions: read
jobs:
  response:
    runs-on: macos-26-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check public playback response
        run: |
          curl -sSL --max-time 20 'https://www.youtube.com/watch?v=Iit7ZaSLRTw' -o "$RUNNER_TEMP/watch.html"
          python3 - "$RUNNER_TEMP/watch.html" <<'PY'
          import sys,re,json
          text=open(sys.argv[1]).read()
          m=re.search(r'(?:var )?ytInitialPlayerResponse\s*=\s*',text)
          if m:
            response,_=json.JSONDecoder().raw_decode(text[m.end():])
            p=response.get('playabilityStatus',{})
            print('Playability:',p.get('status'),p.get('reason'))
          PY
      - name: Probe the same native loader
        working-directory: ios/probe
        run: |
          cp ../AutoReelsMaker/YouTubeReference.swift Sources/Probe/
          swift run Probe
