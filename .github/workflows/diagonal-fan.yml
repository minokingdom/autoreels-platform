name: diagonal-fan
on:
  push:
    branches: [main]
    paths: ['public/assets/app/07-reference-styles.js', 'public/assets/app/06-design-kit.js', 'public/assets/reference-styles.json', 'lib/reference-style.cjs', 'lib/reference-analysis.cjs', 'tests/diagonal-fan-browser.mjs', 'tests/reference-styles.cjs', '.github/workflows/diagonal-fan.yml']
  pull_request:
    paths: ['public/assets/app/07-reference-styles.js', 'public/assets/app/06-design-kit.js', 'public/assets/reference-styles.json', 'lib/reference-style.cjs', 'lib/reference-analysis.cjs', 'tests/diagonal-fan-browser.mjs', 'tests/reference-styles.cjs', '.github/workflows/diagonal-fan.yml']
  workflow_dispatch:
jobs:
  diagonal-fan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save playwright@1.48.2
      - run: npx playwright install --with-deps chromium
      - run: node scripts/build-app.mjs
      - run: node --check public/assets/app/app.js
      - run: node tests/reference-styles.cjs
      - run: node tests/production-safety.cjs
      - run: node tests/diagonal-fan-browser.mjs
