<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoReels BGM 검수 · 청음</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px 16px 48px;
      background: #0d0d10; color: #ededed;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif;
    }
    .wrap { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 6px; }
    .sub { font-size: 13px; color: #9a9aa0; margin: 0 0 18px; line-height: 1.5; }
    .card {
      background: #17171c; border: 1px solid #2a2a33; border-radius: 12px;
      padding: 14px; margin-bottom: 12px;
    }
    .title { font-size: 14px; font-weight: 600; margin-bottom: 4px; color: #fff; }
    .meta { font-size: 12px; color: #8c8c94; margin-bottom: 10px; }
    audio { width: 100%; height: 38px; }
    .badge {
      display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 999px;
      background: #23232d; color: #7dd3fc; margin-left: 6px; vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>AutoReels 생성 음원 청음</h1>
    <p class="sub">아래 트랙들을 들어보시고, 카카오톡이나 대화창에 <b>승인할 곡 이름</b>을 말씀해 주세요.<br/>승인한 곡만 AutoReels 정식 BGM에 올리고 나머지는 삭제합니다.</p>
    <div id="list"></div>
  </div>
  <script>
    const TRACKS = [
      { name: "한글보컬 CM송 테스트", file: "한글보컬_CM송_테스트_s7.mp3", desc: "보컬 포함 · 40초 · 118 BPM (ACE-Step Apache 2.0)" },
      { name: "자동차쇼룸 일렉트로닉하우스", file: "자동차쇼룸_일렉트로닉하우스_s7.mp3", desc: "무보컬 BGM · 45초 · 118 BPM" },
      { name: "감성카페 보사노바재즈", file: "감성카페_보사노바재즈_s7.mp3", desc: "무보컬 BGM · 45초 · 96 BPM" },
      { name: "맛집 어쿠스틱그루브", file: "맛집_어쿠스틱그루브_s7.mp3", desc: "무보컬 BGM · 45초 · 108 BPM" },
      { name: "뷰티헤어 트렌디RnB", file: "뷰티헤어_트렌디RnB_s7.mp3", desc: "무보컬 BGM · 45초 · 94 BPM" },
      { name: "피트니스 파워트랩", file: "피트니스_파워트랩_s7.mp3", desc: "무보컬 BGM · 45초 · 132 BPM" },
      { name: "부동산 프리미엄라운지", file: "부동산_프리미엄라운지_s7.mp3", desc: "무보컬 BGM · 45초 · 114 BPM" },
      { name: "학원교육 로파이비트", file: "학원교육_로파이비트_s7.mp3", desc: "무보컬 BGM · 45초 · 86 BPM" },
      { name: "클리닉 신뢰감앰비언트", file: "클리닉_신뢰감앰비언트_s7.mp3", desc: "무보컬 BGM · 45초 · 90 BPM" },
      { name: "쇼핑몰 시티팝", file: "쇼핑몰_시티팝_s7.mp3", desc: "무보컬 BGM · 45초 · 112 BPM" },
      { name: "인테리어 북유럽미니멀", file: "인테리어_북유럽미니멀_s7.mp3", desc: "무보컬 BGM · 45초 · 92 BPM" }
    ];
    const root = document.getElementById("list");
    TRACKS.forEach((t) => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="title">${t.name}</div>
        <div class="meta">${t.desc}</div>
        <audio controls preload="none" src="/assets/bgm/review/${encodeURIComponent(t.file)}"></audio>
      `;
      root.appendChild(card);
    });
    document.addEventListener("play", (e) => {
      if (e.target.tagName !== "AUDIO") return;
      document.querySelectorAll("audio").forEach((a) => { if (a !== e.target) a.pause(); });
    }, true);
  </script>
</body>
</html>
